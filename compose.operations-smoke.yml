services:
  blackbox:
    environment:
      SSL_CERT_FILE: /etc/blackbox/smoke-ca.pem
    volumes:
      - ${CAL_TLS_DIRECTORY}/live/cal.b4ton.com/fullchain.pem:/etc/blackbox/smoke-ca.pem:ro
    ports:
      - target: 9115
        host_ip: 127.0.0.1
  app:
    pull_policy: never
    ports:
      - target: 8081
        host_ip: 127.0.0.1
  alert-receiver:
    image: python:3.14.8-alpine3.23@sha256:e7cff362a12454395f8dc99607c21a602ea880cdce03538877b90c2ba932b16f
    command: [python, /app/alert-receiver.py]
    volumes:
      - ./scripts/fixtures/alert-receiver.py:/app/alert-receiver.py:ro
    ports:
      - target: 8080
        host_ip: 127.0.0.1
