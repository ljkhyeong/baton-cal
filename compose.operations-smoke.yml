services:
  blackbox:
    environment:
      SSL_CERT_FILE: /etc/blackbox/smoke-ca.pem
    volumes:
      - ${CAL_TLS_DIRECTORY}/live/cal.b4ton.com/fullchain.pem:/etc/blackbox/smoke-ca.pem:ro
    ports:
      - target: 9115
        host_ip: 127.0.0.1
  app:
    pull_policy: never
    ports:
      - target: 8081
        host_ip: 127.0.0.1
  alert-receiver:
    image: python:3.14.7-alpine3.23@sha256:8caa2adfeb414dfe68d8b257f7aea9e205a400521c2b13b2d2e5e731fb8e70e5
    command: [python, /app/alert-receiver.py]
    volumes:
      - ./scripts/fixtures/alert-receiver.py:/app/alert-receiver.py:ro
    ports:
      - target: 8080
        host_ip: 127.0.0.1
