services:
  blackbox:
    environment:
      SSL_CERT_FILE: /etc/blackbox/smoke-ca.pem
    volumes:
      - ${CAL_TLS_DIRECTORY}/live/cal.b4ton.com/fullchain.pem:/etc/blackbox/smoke-ca.pem:ro
    ports:
      - target: 9115
        host_ip: 127.0.0.1
  app:
    pull_policy: never
    ports:
      - target: 8081
        host_ip: 127.0.0.1
  alert-receiver:
    image: python:3.15.0-alpine3.23@sha256:d64bc17e0dff27c5c4a31f616450d032aa73d6325855127ce3a305bf1384c8d5
    command: [python, /app/alert-receiver.py]
    volumes:
      - ./scripts/fixtures/alert-receiver.py:/app/alert-receiver.py:ro
    ports:
      - target: 8080
        host_ip: 127.0.0.1
