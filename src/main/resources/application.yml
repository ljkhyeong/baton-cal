spring:
  application:
    name: baton-cal
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    factory:
      constraints:
        read:
          max-document-length: 131072
          max-name-length: 64
          max-nesting-depth: 16
          max-number-length: 10
          max-token-count: 256
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/baton_cal}
    username: ${DATABASE_USERNAME:baton_cal}
    password: ${DATABASE_PASSWORD:baton_cal}
    hikari:
      maximum-pool-size: ${DATABASE_MAXIMUM_POOL_SIZE:10}
      connection-init-sql: >-
        SET lock_timeout TO '${DATABASE_LOCK_TIMEOUT:5s}';
        SET statement_timeout TO '${DATABASE_STATEMENT_TIMEOUT:30s}'
  flyway:
    enabled: true
  transaction:
    default-timeout: ${DATABASE_TRANSACTION_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: false
      pattern: "%a %t %s %b %D"

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

baton:
  cal:
    internal-token: ${BATON_CAL_INTERNAL_TOKEN}
    public-base-url: ${BATON_CAL_PUBLIC_BASE_URL:http://localhost:8080}
