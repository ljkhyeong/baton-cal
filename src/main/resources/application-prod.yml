spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}

baton:
  cal:
    public-base-url: ${BATON_CAL_PUBLIC_BASE_URL}
    subscription-generation: ${BATON_CAL_SUBSCRIPTION_GENERATION}

logging:
  level:
    org.springframework.jdbc.core.StatementCreatorUtils: "OFF"
