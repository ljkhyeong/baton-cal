services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: baton_cal
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME이 필요합니다}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?외부에서 DATABASE_PASSWORD를 주입합니다}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    image: ${BATON_CAL_IMAGE:?커밋 SHA 또는 다이제스트로 고정한 이미지가 필요합니다}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/baton_cal
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      BATON_CAL_INTERNAL_TOKEN: ${BATON_CAL_INTERNAL_TOKEN:?외부에서 내부 인증 값을 주입합니다}
      BATON_CAL_PREVIOUS_INTERNAL_TOKEN:
      BATON_CAL_PUBLIC_BASE_URL: https://cal.b4ton.com
      BATON_CAL_SUBSCRIPTION_GENERATION: ${BATON_CAL_SUBSCRIPTION_GENERATION:?기존 구독 세대 또는 최초 생성한 UUID가 필요합니다}
      BATON_CAL_RECOVERY_MODE: ${BATON_CAL_RECOVERY_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CAL_INTERNAL_PORT:-8080}:8080"
    stop_grace_period: 35s
    restart: unless-stopped

  gateway:
    image: nginx:1.31.4-alpine-slim@sha256:1870de6d59aafee152589b64404556d2535922cdd998e6dac1c4888c938ed8f9
    environment:
      CAL_REQUEST_RATE: ${CAL_REQUEST_RATE:-10r/s}
      CAL_REQUEST_BURST: ${CAL_REQUEST_BURST:-20}
      CAL_CONNECTION_LIMIT: ${CAL_CONNECTION_LIMIT:-20}
      NGINX_ENVSUBST_FILTER: ^CAL_
    volumes:
      - ./operations/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./operations/nginx/calendar.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${CAL_TLS_DIRECTORY:?인증서 디렉터리가 필요합니다}:/etc/letsencrypt:ro
      - ${CAL_ACME_DIRECTORY:?ACME 갱신 디렉터리가 필요합니다}:/var/www/acme:ro
    ports:
      - "${CAL_GATEWAY_BIND:-127.0.0.1}:${CAL_HTTP_PORT:-80}:80"
      - "${CAL_GATEWAY_BIND:-127.0.0.1}:${CAL_HTTPS_PORT:-443}:443"
    depends_on:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1-distroless@sha256:214f8427c8fba80c327bb94a75feb802ae12f2d6ca30812aa6e7d22f09bbea80
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./operations/prometheus:/etc/prometheus:ro
      - metrics:/prometheus
    ports:
      - "127.0.0.1:${CAL_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ${CAL_ALERTMANAGER_CONFIG_FILE:-./operations/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${CAL_ALERT_WEBHOOK_URL_FILE:?알림 수신 URL을 담은 외부 파일이 필요합니다}:/run/secrets/alert-webhook-url:ro
      - alerts:/alertmanager
    ports:
      - "127.0.0.1:${CAL_ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./operations/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

volumes:
  database:
  metrics:
  alerts:
