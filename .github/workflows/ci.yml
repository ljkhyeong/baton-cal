name: 지속적 검증

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 테스트와 OCI 이미지 검증
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BATON_CAL_IMAGE: baton-cal:${{ github.sha }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 25 설정
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: 전체 테스트, 계약 팩과 OCI 이미지 빌드
        run: ./gradlew --no-daemon test contractsZip bootBuildImage --imageName="$BATON_CAL_IMAGE"

      - name: OCI 이미지 스모크 검증
        run: ./scripts/smoke-oci-image.sh "$BATON_CAL_IMAGE"

      - name: 계약 팩 업로드
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/distributions/baton-cal-contracts-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 90

  verify-and-publish:
    name: 테스트, OCI 이미지 검증과 게시
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      BATON_CAL_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 25 설정
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: 전체 테스트, 계약 팩과 OCI 이미지 빌드
        run: ./gradlew --no-daemon test contractsZip bootBuildImage --imageName="$BATON_CAL_IMAGE"

      - name: OCI 이미지 스모크 검증
        run: ./scripts/smoke-oci-image.sh "$BATON_CAL_IMAGE"

      - name: GHCR 로그인
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 검증한 OCI 이미지 게시
        run: docker push "$BATON_CAL_IMAGE"

      - name: 계약 팩 업로드
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/distributions/baton-cal-contracts-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 90
