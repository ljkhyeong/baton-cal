name: 지속적 검증

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 테스트와 OCI 이미지 검증
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BATON_CAL_IMAGE: baton-cal:${{ github.sha }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: Java 25 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 전체 테스트, 계약 팩과 OCI 이미지 빌드
        run: ./gradlew --no-daemon test contractsZip bootBuildImage --imageName="$BATON_CAL_IMAGE"

      - name: OCI 이미지 스모크 검증
        run: ./scripts/smoke-oci-image.sh "$BATON_CAL_IMAGE"

      - name: 계약 팩 업로드
        uses: actions/upload-artifact@v7
        with:
          path: build/distributions/baton-cal-contracts-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 90
