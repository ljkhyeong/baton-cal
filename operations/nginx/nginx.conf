user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Nginx 오류 메시지는 비밀 경로를 포함할 수 있으므로 요청 오류 원문은 기록하지 않는다.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format calendar 'status=$status duration=$request_time limit_req=$limit_req_status limit_conn=$limit_conn_status';
    access_log /dev/stdout calendar;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    include /etc/nginx/conf.d/*.conf;
}
