groups:
  - name: baton-cal
    rules:
      - alert: CalWatchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: CAL 모니터링 정상 신호
          description: 외부 점검 서비스에 주기적으로 보내는 신호입니다. 장애 알림이 아닙니다.
      - alert: CalMetricsUnavailable
        expr: up{job="baton-cal"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: CAL 메트릭 수집 실패
          description: 애플리케이션과 관리 포트의 연결 상태를 확인합니다.
      - alert: CalReadinessFailed
        expr: probe_success{job="baton-cal-readiness"} == 0 or up{job="baton-cal-readiness"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: CAL 준비 상태 확인 실패
          description: CAL과 PostgreSQL 상태를 확인합니다. 복구 모드는 별도 조회합니다.
      - alert: CalHttpServerErrors
        expr: sum(increase(http_server_requests_seconds_count{job="baton-cal",status=~"5.."}[5m])) >= 5
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: CAL 서버 오류 증가
          description: 최근 5분 동안 5xx가 5회 이상 발생했습니다. 잠금과 DB 상태를 함께 확인합니다.
      - alert: CalProjectionLockSlow
        expr: rate(baton_cal_projection_lock_acquire_seconds_sum{job="baton-cal"}[5m]) / rate(baton_cal_projection_lock_acquire_seconds_count{job="baton-cal"}[5m]) > 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: CAL 시즌 잠금 획득 지연
          description: 최근 5분 평균 잠금 획득 시간이 1초를 넘었습니다. 시즌별 동시 수신량을 확인합니다.
      - alert: CalTlsFailed
        expr: probe_success{job="baton-cal-tls"} == 0 or up{job="baton-cal-tls"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: CAL HTTPS 인증서 확인 실패
          description: cal.b4ton.com의 인증서 이름·인증서 체인과 HTTPS 연결을 확인합니다.
      - alert: CalPublicRouteFailed
        expr: probe_success{job="baton-cal-public"} == 0 or up{job="baton-cal-public"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: CAL 공개 경로 확인 실패
          description: 공개 캘린더 경로가 예상한 빈 404를 반환하지 않습니다. 프록시와 CAL 연결을 확인합니다.
      - alert: CalCertificateExpiresSoon
        expr: probe_ssl_earliest_cert_expiry{job="baton-cal-tls"} - time() < 14 * 24 * 60 * 60
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: CAL 인증서 만료 임박
          description: cal.b4ton.com 인증서가 14일 이내에 만료됩니다. 갱신과 적용 상태를 확인합니다.
