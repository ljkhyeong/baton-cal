route:
  receiver: operations
  group_by: [alertname]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="CalWatchdog"']
      receiver: discard
receivers:
  - name: discard
  - name: operations
    slack_configs:
      - api_url_file: /run/secrets/alert-webhook-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}장애 발생{{ else }}복구{{ end }}: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.description }}{{ "\n" }}{{ end }}'
