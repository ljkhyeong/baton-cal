route:
  receiver: operations
  group_by: [alertname]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="CalWatchdog"']
      receiver: discard
receivers:
  - name: discard
  - name: operations
    webhook_configs:
      - url_file: /run/secrets/alert-webhook-url
        send_resolved: true
