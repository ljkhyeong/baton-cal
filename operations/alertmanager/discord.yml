route:
  receiver: operations
  group_by: [alertname]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: operations
    discord_configs:
      - webhook_url_file: /run/secrets/alert-webhook-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}장애 발생{{ else }}복구{{ end }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.description }}{{ "\n" }}{{ end }}'
